name: Docker Image CI

on:
  schedule:
  - cron: 0 10 * * *
  push:
    branches-ignore:
    - renovate/**
    - dependabot/**
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version including the v prefix
        required: true
        type: string
      source_sha:
        description: Source commit to build
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      digest:
        description: Published image manifest digest
        value: ${{ jobs.docker.outputs.digest }}

jobs:
  docker:
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.source_sha || '' }}
    - name: Test release flow
      run: node --test tests/release.test.cjs

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  # zizmor: ignore[secrets-outside-env]
        password: ${{ secrets.DOCKERHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env]

    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
          # list of Docker images to use as base name for tags
        images: |
          weblate/base
          ghcr.io/weblateorg/base
         # generate Docker tags based on the following events/attributes
        tags: |
          type=schedule,enable=${{ !inputs.version }}
          type=ref,event=branch,enable=${{ !inputs.version }}
          type=ref,event=pr,enable=${{ !inputs.version }}
          type=semver,value=${{ inputs.version }},enable=${{ inputs.version != '' }},pattern={{version}}
          type=semver,value=${{ inputs.version }},enable=${{ inputs.version != '' }},pattern={{major}}.{{minor}}
          type=semver,value=${{ inputs.version }},enable=${{ inputs.version != '' }},pattern={{major}}
          type=edge,branch=main,enable=${{ !inputs.version }}
          type=sha,format=long

    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: weblate/base:test

    - name: Check content
      env:
        TEST_CONTAINER: weblate/base:test
      run: ./tests/test-content

    - name: Build and push
      id: publish
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
permissions:
  contents: read
