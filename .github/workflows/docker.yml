name: Docker Image CI

on:
  schedule:
  - cron: 0 10 * * *
  push:
    branches-ignore:
    - renovate/**
    - dependabot/**
    tags:
    - v*
  pull_request:

jobs:
  docker:
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}  # zizmor: ignore[secrets-outside-env]
        password: ${{ secrets.DOCKERHUB_TOKEN }}  # zizmor: ignore[secrets-outside-env]

    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
          # list of Docker images to use as base name for tags
        images: |
          weblate/base
          ghcr.io/weblateorg/base
         # generate Docker tags based on the following events/attributes
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=edge,branch=main
          type=sha,format=long

    - name: Build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        load: true
        tags: weblate/base:test

    - name: Check content
      env:
        TEST_CONTAINER: weblate/base:test
      run: ./tests/test-content

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
permissions:
  contents: read
