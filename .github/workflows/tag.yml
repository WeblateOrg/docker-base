name: Weekly tag

on:
  schedule:
  - cron: 0 10 * * 0
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-26.04
    steps:
    - name: 🏷️ Create/update tag
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ github.token }}
        script: |
          const now = new Date;
          const onejan = new Date(now.getFullYear(), 0, 1);
          /* This is not a ISO-8601 week number but works well for versioning */
          const week = Math.ceil((((now.getTime() - onejan.getTime()) / 86400000) + onejan.getDay() + 1) / 7);
          const tagPrefix = `v${ now.getFullYear() }.${ week }.`;
          const {data: refs} = await github.rest.git.listMatchingRefs({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `tags/${ tagPrefix }`,
          });
          let patch = 0;
          for (const {ref} of refs) {
            const suffix = ref.slice(`refs/tags/${ tagPrefix }`.length);
            if (/^\d+$/.test(suffix)) {
              patch = Math.max(patch, Number(suffix) + 1);
            }
          }
          const tagName = `${ tagPrefix }${ patch }`;
          const tag_result = await github.rest.git.createTag({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag: tagName,
            message: `chore: automatically tagged release ${ tagName }`,
            object: context.sha,
            type: 'commit',
          });
          console.log(tag_result);
          const ref_result = await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/tags/${ tagName }`,
            sha: context.sha
          });
          console.log(ref_result);
          for (const workflow_id of ['release.yml', 'docker.yml']) {
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: tagName,
            });
          }
