name: Release

on:
  schedule:
  - cron: 0 10 * * 0
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      base_image: ${{ steps.version.outputs.base_image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Test release flow
      run: node --test tests/release.test.cjs
    - name: Select release version
      id: version
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const {prepare} = require('./.github/scripts/release.cjs');
          await prepare({github, context, core, dev: false});

  publish:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  finalize:
    needs: [prepare, publish]
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ needs.prepare.outputs.source_sha }}
    - name: Create annotated tag and GitHub release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        BASE_IMAGE: ${{ needs.prepare.outputs.base_image }}
      with:
        script: |
          const {finalize} = require('./.github/scripts/release.cjs');
          await finalize({
            github, context, core,
            version: process.env.RELEASE_VERSION,
            sourceSha: process.env.SOURCE_SHA,
            digest: process.env.IMAGE_DIGEST,
            baseImage: process.env.BASE_IMAGE,
          });
